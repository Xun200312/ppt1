<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕸️ 3D 臉部動畫前沿知識拓撲與圖譜投影片 🚀 Y2K Graph Deck</title>
  <!-- KaTeX for formula rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      /* Softened Pastel Y2K Cyber Palette */
      --cyan: #38bdf8;
      --cyan-soft: rgba(56, 189, 248, 0.12);
      --pink: #f472b6;
      --pink-soft: rgba(244, 114, 182, 0.12);
      --lime: #34d399;
      --lime-soft: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.12);
      
      --bg-dark: #0f1423;
      --bg-panel: #151b2e;
      --card-bg: rgba(21, 28, 48, 0.94);
      --card-border: 1px solid rgba(56, 189, 248, 0.25);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-soft: #cbd5e1;

      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Segoe UI Emoji", sans-serif;
      --font-code: "Cascadia Code", "Consolas", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 114, 182, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text-main);
      font-family: var(--font-body);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Cyber Navigation Bar */
    .top-bar {
      height: 56px;
      background: rgba(15, 20, 35, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1.5px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 1000;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .brand-tag {
      background: linear-gradient(135deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-code);
      font-weight: 900;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text-soft);
      padding: 0.38rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
      color: #fff;
      transform: translateY(-1px);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(244, 114, 182, 0.25));
      border-color: var(--pink);
      color: #fff;
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.3);
    }

    .nav-btn.pill-lime {
      border-color: var(--lime);
      color: var(--lime);
      background: rgba(52, 211, 153, 0.08);
    }
    .nav-btn.pill-lime:hover {
      background: rgba(52, 211, 153, 0.2);
    }

    /* Main View Area */
    #main-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* ============================================================
       VIEW 1: MACRO GRAPH CANVAS (全域知識圖譜互動畫布)
       ============================================================ */
    #graph-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(21, 28, 48, 0.5) 0%, #0a0d18 100%);
      overflow: hidden;
      cursor: grab;
      display: flex;
    }

    #graph-canvas-container:active {
      cursor: grabbing;
    }

    #graph-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Graph Toolbar & Legend */
    .graph-hud {
      position: absolute;
      top: 1rem;
      left: 1.5rem;
      background: rgba(15, 20, 35, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 0.65rem;
      padding: 0.8rem 1.1rem;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .hud-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.74rem;
      color: var(--text-soft);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .graph-controls {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 0.5rem;
      z-index: 10;
    }

    .ctrl-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(15, 20, 35, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan);
      transform: scale(1.05);
    }

    /* SVG Node & Edge styling */
    .graph-edge {
      stroke: rgba(56, 189, 248, 0.25);
      stroke-width: 1.6;
      transition: stroke 0.3s, stroke-width 0.3s;
    }
    .graph-edge.active {
      stroke: var(--pink) !important;
      stroke-width: 2.8 !important;
    }
    .edge-label {
      font-size: 10px;
      fill: #94a3b8;
      font-family: var(--font-code);
      text-anchor: middle;
      pointer-events: none;
    }

    .graph-node {
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .graph-node:hover {
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.6));
    }
    .graph-node text {
      pointer-events: none;
    }

    /* ============================================================
       VIEW 2: MICRO SLIDE VIEW (投影片卡片微觀全視角)
       ============================================================ */
    #slide-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 13, 24, 0.94);
      backdrop-filter: blur(14px);
      z-index: 500;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      overflow-y: auto;
      padding: 1.5rem;
      align-items: center;
      justify-content: center;
    }

    #slide-modal.open {
      display: flex;
      opacity: 1;
    }

    .slide-card-wrapper {
      width: 100%;
      max-width: 1120px;
      min-height: 82vh;
      background: var(--card-bg);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slidePop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slidePop {
      from { transform: scale(0.96) translateY(12px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Slide Card Top Header */
    .card-top {
      height: 52px;
      background: rgba(15, 20, 35, 0.9);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .card-cluster-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.65rem;
      border-radius: 4px;
      font-family: var(--font-code);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-hub { background: rgba(56, 189, 248, 0.15); color: var(--cyan); border: 1px solid var(--cyan); }
    .badge-modalities { background: rgba(251, 191, 36, 0.15); color: var(--amber); border: 1px solid var(--amber); }
    .badge-methods { background: rgba(244, 114, 182, 0.15); color: var(--pink); border: 1px solid var(--pink); }
    .badge-reps { background: rgba(167, 139, 250, 0.15); color: var(--purple); border: 1px solid var(--purple); }
    .badge-metrics { background: rgba(52, 211, 153, 0.15); color: var(--lime); border: 1px solid var(--lime); }
    .badge-scenarios { background: rgba(244, 114, 182, 0.15); color: #f43f5e; border: 1px solid #f43f5e; }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .close-btn {
      background: rgba(244, 114, 182, 0.15);
      border: 1px solid var(--pink);
      color: #fff;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }
    .close-btn:hover {
      background: var(--pink);
      color: #000;
    }

    /* Slide Card Body Content */
    .card-body {
      flex: 1;
      padding: 1.8rem 2.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .slide-title-bar {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.8rem;
    }

    .slide-title {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 0.35rem;
      background: linear-gradient(180deg, #fff 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .content-grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.5rem;
      align-items: start;
    }

    .text-column h4 {
      font-size: 1.05rem;
      color: var(--cyan);
      margin-top: 0.6rem;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .text-column p, .text-column li {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-soft);
      margin-bottom: 0.55rem;
    }

    .text-column ul {
      list-style-type: none;
      padding-left: 0.2rem;
    }
    .text-column ul li {
      position: relative;
      padding-left: 1.2rem;
    }
    .text-column ul li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--pink);
      font-weight: bold;
    }

    /* Schematic Box inside Card */
    .schematic-card {
      background: rgba(15, 20, 35, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 0.75rem;
      padding: 0.9rem;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .schematic-title {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .schematic-card svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Metric Callout Card */
    .highlight-card {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3.5px solid var(--cyan);
      border-radius: 0 6px 6px 0;
      padding: 0.8rem 1rem;
      margin: 0.6rem 0;
      font-size: 0.88rem;
    }

    /* Edge Jump Section at bottom of Card */
    .card-footer-edges {
      background: rgba(15, 20, 35, 0.9);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.9rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .edge-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .edge-row-label {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      min-width: 80px;
    }

    .edge-jump-pill {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      padding: 0.28rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .edge-jump-pill:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--cyan);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.25);
    }

    .edge-jump-pill.pill-pink {
      background: rgba(244, 114, 182, 0.08);
      border-color: rgba(244, 114, 182, 0.35);
      color: var(--pink);
    }
    .edge-jump-pill.pill-pink:hover {
      background: rgba(244, 114, 182, 0.25);
      border-color: var(--pink);
      color: #fff;
    }

    .edge-jump-pill.pill-amber {
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.35);
      color: var(--amber);
    }
    .edge-jump-pill.pill-amber:hover {
      background: rgba(251, 191, 36, 0.25);
      border-color: var(--amber);
      color: #fff;
    }

    .edge-jump-pill.pill-lime {
      background: rgba(52, 211, 153, 0.08);
      border-color: rgba(52, 211, 153, 0.35);
      color: var(--lime);
    }
    .edge-jump-pill.pill-lime:hover {
      background: rgba(52, 211, 153, 0.25);
      border-color: var(--lime);
      color: #fff;
    }

    .edge-jump-pill.pill-purple {
      background: rgba(167, 139, 250, 0.08);
      border-color: rgba(167, 139, 250, 0.35);
      color: var(--purple);
    }
    .edge-jump-pill.pill-purple:hover {
      background: rgba(167, 139, 250, 0.25);
      border-color: var(--purple);
      color: #fff;
    }

    /* Linear Nav in Footer */
    .card-bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }

    .linear-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-soft);
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .linear-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Table in slides */
    .styled-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin: 0.5rem 0;
      background: rgba(15, 20, 35, 0.6);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .styled-table th {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      padding: 0.45rem 0.6rem;
      text-align: left;
      font-weight: 700;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
    }
    .styled-table td {
      padding: 0.45rem 0.6rem;
      color: var(--text-soft);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .styled-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .highlight-cell {
      color: var(--lime) !important;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <!-- Top Cyber Bar -->
  <header class="top-bar">
    <div class="brand">
      <span>🛸</span>
      <span class="brand-tag">3D-FACE GRAPH.EXE</span>
      <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">· 前沿知識拓撲與圖譜投影片</span>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active" id="btn-mode-graph" onclick="switchView('graph')">🕸️ 全域拓撲圖 (Graph)</button>
      <button class="nav-btn" id="btn-mode-slide" onclick="switchView('slide')">🃏 投影片卡片 (Slide)</button>
      <a href="../handouts/3D_Facial_Animation_Handbook.html" class="nav-btn pill-lime">📖 推薦講義手冊 ↗</a>
      <a href="3D_Facial_Animation_Survey.html" class="nav-btn">🖥️ 經典簡報 ↗</a>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-container">

    <!-- ========================================== -->
    <!-- VIEW 1: MACRO GRAPH CANVAS                -->
    <!-- ========================================== -->
    <div id="graph-canvas-container">
      
      <!-- Graph HUD Overlay -->
      <div class="graph-hud">
        <div class="hud-title"><span>🌐</span> 知識圖譜導覽指針</div>
        <div class="legend-list">
          <div class="legend-item"><div class="legend-dot" style="background: var(--cyan);"></div> 核心樞紐 (Hub)</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--amber);"></div> 輸入模態層 (Modalities)</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--pink);"></div> 核心論文方法層 (Papers)</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--purple);"></div> 3D 幾何表徵層 (Representations)</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--lime);"></div> 評測基準層 (Metrics)</div>
          <div class="legend-item"><div class="legend-dot" style="background: #f43f5e;"></div> 擬推薦決策層 (Scenarios)</div>
        </div>
        <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.6rem;">
          💡 <strong>操作提示</strong>：點選任一節點進入該投影片；拖曳移動畫布。
        </div>
      </div>

      <!-- Graph Canvas Zoom Controls -->
      <div class="graph-controls">
        <button class="ctrl-btn" onclick="zoomGraph(1.15)" title="放大">+</button>
        <button class="ctrl-btn" onclick="zoomGraph(0.85)" title="縮小">-</button>
        <button class="ctrl-btn" onclick="resetGraphZoom()" title="重置視角">⟲</button>
      </div>

      <!-- Interactive SVG Graph -->
      <svg id="graph-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Arrow Markers -->
          <marker id="arrow-cyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#38bdf8"/></marker>
          <marker id="arrow-pink" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#f472b6"/></marker>
          <marker id="arrow-lime" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#34d399"/></marker>
          <marker id="arrow-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#fbbf24"/></marker>
          <marker id="arrow-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#a78bfa"/></marker>

          <!-- Glow Filter -->
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- Dynamic Graph Container (g-transformable) -->
        <g id="graph-root" transform="matrix(1 0 0 1 0 0)">
          <!-- Rendered dynamically by JavaScript -->
          <g id="edges-layer"></g>
          <g id="nodes-layer"></g>
        </g>
      </svg>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: MICRO SLIDE MODAL CARD            -->
    <!-- ========================================== -->

        const startX = sNode.x + (dx / dist) * sNode.r;
        const startY = sNode.y + (dy / dist) * sNode.r;
        const endX = tNode.x - (dx / dist) * (tNode.r + 4);
        const endY = tNode.y - (dy / dist) * (tNode.r + 4);

        const edgeEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
        edgeEl.setAttribute("d", `M ${startX} ${startY} L ${endX} ${endY}`);
        edgeEl.setAttribute("class", "graph-edge");
        edgeEl.setAttribute("id", `edge-${edge.source}-${edge.target}`);
        edgeEl.setAttribute("stroke", edge.color || "rgba(56,189,248,0.3)");
        
        let marker = "url(#arrow-cyan)";
        if (edge.color === "#fbbf24") marker = "url(#arrow-amber)";
        else if (edge.color === "#f472b6") marker = "url(#arrow-pink)";
        else if (edge.color === "#34d399") marker = "url(#arrow-lime)";
        else if (edge.color === "#a78bfa") marker = "url(#arrow-purple)";
        edgeEl.setAttribute("marker-end", marker);

        edgesLayer.appendChild(edgeEl);

        // Edge label at midpoint
        const midX = (startX + endX) / 2;
        const midY = (startY + endY) / 2;
        const labelEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
        labelEl.setAttribute("x", midX);
        labelEl.setAttribute("y", midY - 3);
        labelEl.setAttribute("class", "edge-label");
        labelEl.textContent = edge.label || "";
        edgesLayer.appendChild(labelEl);
      });

      // 2. Draw Nodes
      nodesLayer.innerHTML = '';
      GRAPH_NODES.forEach((node, idx) => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "graph-node");
        g.setAttribute("id", `node-${node.id}`);
        g.setAttribute("transform", `translate(${node.x}, ${node.y})`);
        g.onclick = () => openSlideModal(idx);

        // Outer Glow Circle
        const circleOuter = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circleOuter.setAttribute("r", node.r + 4);
        circleOuter.setAttribute("fill", "none");
        circleOuter.setAttribute("stroke", node.color);
        circleOuter.setAttribute("stroke-width", "1.5");
        circleOuter.setAttribute("opacity", "0.4");
        circleOuter.setAttribute("stroke-dasharray", "4,3");

        // Main Node Circle
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", node.r);
        circle.setAttribute("fill", "#151b2e");
        circle.setAttribute("stroke", node.color);
        circle.setAttribute("stroke-width", "2.5");

        // Label Text
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("y", -3);
        text.setAttribute("fill", "#fff");
        text.setAttribute("font-size", node.r > 32 ? "10.5px" : "9.5px");
        text.setAttribute("font-weight", "800");
        text.textContent = node.label.split(". ")[1] || node.label;

        // Subtitle Text
        const subText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        subText.setAttribute("text-anchor", "middle");
        subText.setAttribute("y", 12);
        subText.setAttribute("fill", node.color);
        subText.setAttribute("font-size", "8px");
        subText.setAttribute("font-family", "var(--font-code)");
        subText.textContent = node.sub;

        g.appendChild(circleOuter);
        g.appendChild(circle);
        g.appendChild(text);
        g.appendChild(subText);
        nodesLayer.appendChild(g);
      });
    }

    // Open Slide Modal
    function openSlideModal(nodeIndex) {
      if (nodeIndex < 0 || nodeIndex >= GRAPH_NODES.length) return;
      currentSlideIndex = nodeIndex;
      const node = GRAPH_NODES[nodeIndex];

      modalNodeId.textContent = `NODE ${node.id}`;
      modalClusterBadge.textContent = node.clusterName;
      modalClusterBadge.className = `card-cluster-badge ${node.badge}`;
      modalCounter.textContent = `${nodeIndex + 1} / ${GRAPH_NODES.length}`;

      // Content Render
      modalCardBody.innerHTML = `
        <div class="slide-title-bar">
          <h2 class="slide-title">${node.title}</h2>
          <div class="slide-subtitle">${node.subtitle}</div>
        </div>
        ${node.contentHtml}
      `;

      // Render Math
      if (window.renderMathInElement) {
        renderMathInElement(modalCardBody, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Inbound Edges Jump Pills
      modalInbound.innerHTML = '';
      const inEdges = GRAPH_EDGES.filter(e => e.target === node.id);
      if (inEdges.length === 0) {
        modalInbound.innerHTML = '<span style="font-size:0.75rem; color:#64748b;">(起點無前序)</span>';
      } else {
        inEdges.forEach(e => {
          const srcIdx = GRAPH_NODES.findIndex(n => n.id === e.source);
          if (srcIdx !== -1) {
            const btn = document.createElement('button');
            btn.className = 'edge-jump-pill';
            btn.innerHTML = `⬅️ [${GRAPH_NODES[srcIdx].label}] <small style="opacity:0.75;">(${e.label})</small>`;
            btn.onclick = () => openSlideModal(srcIdx);
            modalInbound.appendChild(btn);
          }
        });
      }

      // Outbound Edges Jump Pills
      modalOutbound.innerHTML = '';
      const outEdges = GRAPH_EDGES.filter(e => e.source === node.id);
      if (outEdges.length === 0) {
        modalOutbound.innerHTML = '<span style="font-size:0.75rem; color:#64748b;">(無後續分支)</span>';
      } else {
        outEdges.forEach(e => {
          const tgtIdx = GRAPH_NODES.findIndex(n => n.id === e.target);
          if (tgtIdx !== -1) {
            const btn = document.createElement('button');
            let pillClass = 'edge-jump-pill';
            if (e.color === '#f472b6') pillClass += ' pill-pink';
            else if (e.color === '#fbbf24') pillClass += ' pill-amber';
            else if (e.color === '#34d399') pillClass += ' pill-lime';
            else if (e.color === '#a78bfa') pillClass += ' pill-purple';
            btn.className = pillClass;
            btn.innerHTML = `➡️ [${GRAPH_NODES[tgtIdx].label}] <small style="opacity:0.75;">(${e.label})</small>`;
            btn.onclick = () => openSlideModal(tgtIdx);
            modalOutbound.appendChild(btn);
          }
        });
      }

      slideModal.classList.add('open');
      currentView = 'slide';
      document.getElementById('btn-mode-graph').classList.remove('active');
      document.getElementById('btn-mode-slide').classList.add('active');
    }

    // Close Slide Modal
    function closeSlideModal() {
      slideModal.classList.remove('open');
      currentView = 'graph';
      document.getElementById('btn-mode-slide').classList.remove('active');
      document.getElementById('btn-mode-graph').classList.add('active');
    }

    // Switch View from top bar
    function switchView(view) {
      if (view === 'graph') {
        closeSlideModal();
      } else {
        openSlideModal(currentSlideIndex);
      }
    }

    // Linear Navigation
    function navigateLinear(step) {
      let nextIdx = currentSlideIndex + step;
      if (nextIdx < 0) nextIdx = GRAPH_NODES.length - 1;
      if (nextIdx >= GRAPH_NODES.length) nextIdx = 0;
      openSlideModal(nextIdx);
    }

    // Graph Pan and Zoom
    function updateGraphTransform() {
      graphRoot.setAttribute("transform", `translate(${panX}, ${panY}) scale(${zoomLevel})`);
    }

    function zoomGraph(factor) {
      zoomLevel *= factor;
      zoomLevel = Math.max(0.6, Math.min(zoomLevel, 2.8));
      updateGraphTransform();
    }

    function resetGraphZoom() {
      zoomLevel = 1.0;
      panX = 0;
      panY = 0;
      updateGraphTransform();
    }

    // Canvas Drag Handlers
    const canvasContainer = document.getElementById('graph-canvas-container');
    canvasContainer.addEventListener('mousedown', (e) => {
      if (e.target.closest('.graph-hud') || e.target.closest('.graph-controls')) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateGraphTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'g' || e.key === 'G') {
        if (currentView === 'slide') closeSlideModal();
        else openSlideModal(currentSlideIndex);
      } else if (e.key === 'ArrowRight' || e.key === 'Space') {
        if (currentView === 'slide') navigateLinear(1);
      } else if (e.key === 'ArrowLeft') {
        if (currentView === 'slide') navigateLinear(-1);
      }
    });

    // Initialize on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderGraph();
    });
  </script>
</body>
</html>
